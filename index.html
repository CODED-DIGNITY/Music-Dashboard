<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Music Dashboard</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div id="container">
			<div id="sidebar"></div>
			<div id="topbar"></div>
			<div id="content">
				<div class="main">
					<div class="overview">
						<h2>Overview</h2>
						<div class="stats">
							<div class="card" id="monthly-streams"></div>
							<div class="card" id="listeners"></div>
							<div class="card" id="followers"></div>
							<div class="card" id="revenue"></div>
						</div>
					</div>
					<div class="streams">
						<h2>Streams Over Time</h2>
						<div class="chart"></div>
					</div>
					<div class="platform">
						<h2>Platform Breakdown</h2>
						<div class="donut"></div>
					</div>
					<div class="top-tracks">
						<h2>Top Tracks</h2>
						<div class="Tracks"></div>
					</div>
				</div>
				<div class="side">
					<div class="alerts">
						<h2>Alerts</h2>
						<div class="alert-list"></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
